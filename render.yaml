databases:
  - name: second-brain-db
    plan: free
    databaseName: second_brain
    user: second_brain

services:
  - type: web
    runtime: node
    name: second-brain
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres (multi-user store) — auto-wired from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: second-brain-db
          property: connectionString
      # 32-byte key (hex or base64) for encrypting per-user provider tokens
      - key: TOKEN_ENC_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Access control
      - key: ALLOWED_EMAIL          # bootstrap admin (seeded into allowlist on first boot)
        sync: false
      - key: ADMIN_EMAILS           # comma-separated extra admins (optional)
        sync: false
      # Google OAuth (login + Gmail/Calendar/Drive data)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI           # https://<app>.onrender.com/auth/google/callback
        sync: false
      # Microsoft / Entra OAuth (login only)
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT              # 'common', 'organizations', or a tenant GUID
        sync: false
      - key: MS_REDIRECT_URI        # https://<app>.onrender.com/auth/microsoft/callback
        sync: false
      # Zoho OAuth apps (shared client; each user grants their own refresh token)
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REDIRECT_URI      # https://<app>.onrender.com/connect/zoho/callback
        sync: false
      - key: VORRO_ZOHO_CLIENT_ID
        sync: false
      - key: VORRO_ZOHO_CLIENT_SECRET
        sync: false
      # HubSpot CRM OAuth
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_REDIRECT_URI
        sync: false
      # Microsoft 365 data connection (calendar + Teams transcripts)
      - key: MS_DATA_REDIRECT_URI
        sync: false
      # Recall.ai meeting-bot transcription (single API key; admin fallback)
      - key: RECALL_API_KEY
        sync: false
      - key: RECALL_REGION
        sync: false
      # AI / other (unchanged)
      - key: ANTHROPIC_API_KEY
        sync: false
