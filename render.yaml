services:
  - type: web
    runtime: node
    name: second-brain
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_API_DOMAIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      # G-10 (2026-08-17): these four were live in the Render dashboard but absent
      # from this blueprint, so any "apply blueprint" redeploy silently wiped the AI
      # chain and the service-to-service auth token. sync:false = Render keeps the
      # dashboard value and never overwrites it from this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERVICE_API_TOKEN
        sync: false
